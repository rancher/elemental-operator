name: Stage the charts and images in the Rancher staging registry

# Sends the charts of a release to the staging registry of the Rancher catalog and has
# rancher/charts ship them: the two charts that OBS published to registry.suse.com are
# pulled, named elemental and elemental-crd as the catalog does, stamped with their
# final version, checked, packaged and pushed to stgregistry.suse.com/rancher/catalog,
# and rancher/charts opens a pull request with them against its staging branch.
#
# Run it by hand, after OBS has published the charts of the release:
#
#   gh workflow run stage-charts.yaml --repo rancher/elemental-operator -f tag=v1.9.3 -f rancher-minor=2.16
#
# The charts are the ones of OBS, with the names above and two annotations that the catalog
# checks need, with both bounds: catalog.cattle.io/rancher-version, which is set for the
# Rancher minor given, and catalog.cattle.io/kube-version, which is the range that
# .github/workflows/scripts/rancher-versions.yaml gives for that minor. The Elemental team
# decides and maintains those ranges. A Rancher minor with no entry there is refused, before
# anything is pulled or pushed. Run it once for each Rancher minor, 2.16 or later.
#
# In addition it also pushes the images to the staging registry, OBS does not publish them to the
# staging registry, so the final job here is to copy images over the staging registry too.


on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to stage, such as v1.9.3. OBS must have published its charts."
        required: true
        type: string
      rancher-minor:
        description: "The target rancher minor version, such as 2.16."
        required: true
        type: string

permissions: {}

# Two runs of the same release could push at the same time, and the check that the
# version is not in the registry yet and the push are two calls. A second run waits.
concurrency:
  group: stage-elemental-charts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  stage-charts:
    name: Stage the charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to log in to Vault with the OIDC token
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The tag and rancher-minor is data, not trusted input: it goes through the environment and the
      # script checks it.
      - name: Prepare the charts
        env:
          TAG: ${{ inputs.tag }}
          RANCHER_MINOR: ${{ inputs.rancher-minor }}
        run: .github/workflows/scripts/prepare-charts.sh "$TAG" "$RANCHER_MINOR" "$RUNNER_TEMP/charts"

      # The version is worked out by cargueiro from the appVersion and the versions
      # that are already released.
      - name: Stamp, check, package and push the charts, and start the shipping
        # Please keep this action on the chart-owners branch and do not pin it to a commit.
        # The branch carries the checks that stop a faulty release, for example that the
        # images of the chart are pushed before the chart. A commit keeps only the checks
        # that existed when it was copied.
        uses: rancher/charts/.github/actions/ship-family-staged@chart-owners # zizmor: ignore[unpinned-uses] rancher/charts is an internal trusted repository and its chart-owners branch carries the release checks
        with:
          family: elemental
          chart-dirs: |
            ${{ runner.temp }}/charts/elemental
            ${{ runner.temp }}/charts/elemental-crd

  stage-images:
    name: Stage the images
    needs:
      - stage-charts
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to log in to Vault
    steps:
    # Only the staging registry needs credentials, to write. The source is read anonymously.
    - name: Load the staging registry credentials from Vault
      uses: rancher-eio/read-vault-secrets@7282bf97898cd1c16c89f837e0bb442e6d384c89 # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | TARGET_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | TARGET_PASSWORD

    - name: Copy the image
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -e

        command -v skopeo || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

        if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "Error: tag $TAG must look like vX.Y.Z: only releases are staged" >&2
          exit 1
        fi
        VERSION="${BASH_REMATCH[1]}"

        OBS_IMAGES=(rancher/elemental-operator rancher/seedimage-builder)
        STAGING_REG="stgregistry.suse.com"
        OBS_REG="registry.suse.com"

        for i in "${!OBS_IMAGES[@]}"; do
          skopeo copy --all --preserve-digests \
            --dest-creds "${TARGET_USERNAME}:${TARGET_PASSWORD}" \
            "docker://${OBS_REG}/${OBS_IMAGES[$i]}" "docker://${STAGING_REG}/${OBS_IMAGES[$i]}"

          skopeo inspect --raw --creds "${TARGET_USERNAME}:${TARGET_PASSWORD}" "docker://${STAGING_REG}/${OBS_IMAGES[$i]}" | sha256sum
          skopeo inspect --raw "docker://${OBS_REG}/${OBS_IMAGES[$i]}" | sha256sum
        done
